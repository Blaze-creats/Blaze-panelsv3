<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blaze Admin</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">BLAZE<span>PANELS</span> <small>ADMIN</small></a></header><main class="section"><div class="admin">
