<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Account - Blaze Panels</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="auth">

  <div class="authbox">

    <a class="logo" href="index.html">
      BLAZE<span>PANELS</span>
    </a>

    <h1>Create Account</h1>

    <p class="muted">
      Create your Blaze Panels account with Google.
    </p>

    <button
      class="btn full"
      id="googleRegister"
      type="button"
    >
      Continue with Google
    </button>

    <p id="msg"></p>

    <p class="muted">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>

</main>

<script type="module" src="app.js"></script>

</body>
</html>
